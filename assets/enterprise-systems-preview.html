<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Enterprise systems preview</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 1040px;
      height: 500px;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      color: #17232b;
      background:
        radial-gradient(circle at 14% 12%, rgba(11, 132, 198, .12), transparent 30%),
        linear-gradient(135deg, #edf8f5 0%, #fbfaf6 100%);
    }
    body {
      display: grid;
      grid-template-columns: 1fr 430px;
      gap: 46px;
      align-items: center;
      padding: 42px 56px;
    }
    .copy p { margin: 0; }
    .kicker {
      margin-bottom: 12px;
      color: #1d6b5f;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    h1 {
      max-width: 500px;
      margin: 0 0 22px;
      font-size: 48px;
      line-height: 1.02;
      letter-spacing: -.02em;
    }
    .system-strip {
      display: grid;
      grid-template-columns: repeat(4, 72px);
      gap: 14px;
      margin-top: 28px;
    }
    .token {
      height: 72px;
      border-radius: 18px;
      box-shadow: 0 14px 30px rgba(26, 37, 45, .1);
    }
    .token:nth-child(1) { background: #1d6b5f; }
    .token:nth-child(2) { background: #285ea8; }
    .token:nth-child(3) { background: #b95f45; }
    .token:nth-child(4) { background: #d6a744; }
    .board {
      position: relative;
      width: 430px;
      height: 340px;
    }
    .screen {
      position: absolute;
      inset: 22px 0 0 28px;
      border-radius: 24px;
      background: #fff;
      border: 1px solid #d8e4ea;
      box-shadow: 0 30px 74px rgba(26, 37, 45, .18);
      overflow: hidden;
    }
    .top {
      height: 50px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 18px;
      background: #f7fafb;
      border-bottom: 1px solid #e2e8ed;
    }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #1d6b5f; }
    .dot:nth-child(2) { background: #285ea8; }
    .dot:nth-child(3) { background: #d6a744; }
    .canvas {
      display: grid;
      grid-template-columns: 126px 1fr;
      min-height: 288px;
    }
    .side {
      padding: 18px;
      background: #20221f;
    }
    .side-line {
      height: 12px;
      margin-bottom: 17px;
      border-radius: 999px;
      background: rgba(255,255,255,.24);
    }
    .side-line.active { background: #d6a744; }
    .main {
      padding: 18px;
      background: #f4f8f8;
    }
    .hero-row {
      height: 46px;
      margin-bottom: 16px;
      border-radius: 13px;
      background: #fff;
      border: 1px solid #d8e4ea;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 13px;
    }
    .tile {
      height: 78px;
      padding: 14px;
      border-radius: 16px;
      background: #fff;
      border: 1px solid #d8e4ea;
    }
    .tile::before {
      content: "";
      display: block;
      width: 34px;
      height: 34px;
      margin-bottom: 10px;
      border-radius: 12px;
      background: #1d6b5f;
    }
    .tile:nth-child(2)::before { background: #285ea8; }
    .tile:nth-child(3)::before { background: #b95f45; }
    .tile:nth-child(4)::before { background: #d6a744; }
    .float {
      position: absolute;
      right: 18px;
      bottom: 0;
      width: 248px;
      min-height: 92px;
      padding: 18px;
      border-radius: 20px;
      background: #fff;
      border: 1px solid #d8e4ea;
      box-shadow: 0 24px 55px rgba(26, 37, 45, .16);
    }
    .float-title {
      width: 136px;
      height: 12px;
      margin-bottom: 16px;
      border-radius: 999px;
      background: #20221f;
    }
    .float-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    .mini {
      height: 32px;
      border-radius: 10px;
      background: #1d6b5f;
    }
    .mini:nth-child(2) { background: #285ea8; }
    .mini:nth-child(3) { background: #b95f45; }
    .mini:nth-child(4) { background: #d6a744; }
  </style>
</head>
<body>
  <div class="copy">
    <p class="kicker">Enterprise product systems</p>
    <h1>Reusable interface patterns for complex portals</h1>
    <div class="system-strip">
      <span class="token"></span><span class="token"></span><span class="token"></span><span class="token"></span>
    </div>
  </div>
  <div class="board">
    <div class="screen">
      <div class="top"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
      <div class="canvas">
        <div class="side">
          <div class="side-line active"></div>
          <div class="side-line"></div>
          <div class="side-line"></div>
          <div class="side-line"></div>
          <div class="side-line"></div>
        </div>
        <div class="main">
          <div class="hero-row"></div>
          <div class="grid">
            <div class="tile"></div><div class="tile"></div><div class="tile"></div><div class="tile"></div>
          </div>
        </div>
      </div>
    </div>
    <div class="float">
      <div class="float-title"></div>
      <div class="float-row"><span class="mini"></span><span class="mini"></span><span class="mini"></span><span class="mini"></span></div>
    </div>
  </div>
</body>
</html>
