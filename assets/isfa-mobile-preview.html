<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ISFA mobile preview</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 1040px;
      height: 500px;
      overflow: hidden;
      background: #eef5f8;
      font-family: Arial, Helvetica, sans-serif;
    }
    body {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 40px;
      align-items: center;
      padding: 38px 54px;
      color: #1b2d35;
      background:
        linear-gradient(135deg, rgba(238,245,248,.94), rgba(255,255,255,.92)),
        url("isfa-login-bg.png") center / cover no-repeat;
    }
    .phone {
      width: 242px;
      height: 424px;
      margin-left: 28px;
      padding: 16px;
      border: 14px solid #1f2423;
      border-radius: 38px;
      background: #fff;
      box-shadow: 0 28px 60px rgba(20, 31, 37, .22);
      overflow: hidden;
      position: relative;
    }
    .notch {
      width: 64px;
      height: 6px;
      margin: 0 auto 18px;
      border-radius: 999px;
      background: #cfd5d2;
    }
    .logo {
      display: block;
      width: 118px;
      height: auto;
      margin: 0 auto 24px;
    }
    .welcome {
      margin: 0 0 18px;
      text-align: center;
      color: #00426e;
      font-size: 17px;
      font-weight: 700;
      line-height: 1.2;
    }
    .field {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 42px;
      margin-bottom: 12px;
      padding: 10px 12px;
      border: 1px solid #d8e4ea;
      border-radius: 10px;
      background: #f8fbfc;
      color: #73818a;
      font-size: 13px;
      font-weight: 700;
    }
    .field::before {
      content: "";
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: #0b84c6;
    }
    .login-button {
      display: grid;
      height: 44px;
      place-items: center;
      margin-top: 18px;
      border-radius: 11px;
      background: #e60606;
      color: #fff;
      font-weight: 800;
    }
    .workspace {
      min-width: 0;
    }
    .kicker {
      margin: 0 0 12px;
      color: #e60606;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    h1 {
      max-width: 560px;
      margin: 0 0 18px;
      font-size: 46px;
      line-height: 1.02;
      letter-spacing: -.02em;
    }
    .screens {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      max-width: 590px;
      margin-top: 24px;
    }
    .screen {
      min-height: 142px;
      padding: 16px;
      border: 1px solid #d8e4ea;
      border-radius: 18px;
      background: rgba(255,255,255,.88);
      box-shadow: 0 16px 38px rgba(20, 31, 37, .1);
    }
    .screen-title {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      color: #00426e;
      font-size: 16px;
      font-weight: 800;
    }
    .screen-title::before {
      content: "";
      width: 28px;
      height: 28px;
      border-radius: 9px;
      background: #e60606;
    }
    .line {
      height: 9px;
      margin-bottom: 10px;
      border-radius: 999px;
      background: #dce8ef;
    }
    .line.short { width: 64%; }
    .line.mid { width: 78%; }
    .tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
      margin-top: 14px;
    }
    .tab {
      height: 36px;
      border-radius: 10px;
      background: #eaf3f7;
    }
    .tab:nth-child(1) { background: #0b84c6; }
    .tab:nth-child(2) { background: #9bcce5; }
    .tab:nth-child(3) { background: #f0c9c9; }
    .tab:nth-child(4) { background: #d8e4ea; }
  </style>
</head>
<body>
  <div class="phone">
    <div class="notch"></div>
    <img class="logo" src="isfa-logo.png" alt="">
    <p class="welcome">Intellect Sales Force Application</p>
    <div class="field">User Name</div>
    <div class="field">Password</div>
    <div class="field">Language</div>
    <div class="login-button">Login</div>
  </div>
  <div class="workspace">
    <p class="kicker">Mobile field sales workflow</p>
    <h1>ISFA mobile app screens for field teams</h1>
    <div class="screens">
      <div class="screen">
        <div class="screen-title">Capture Stock</div>
        <div class="line"></div>
        <div class="line mid"></div>
        <div class="line short"></div>
        <div class="tabs"><span class="tab"></span><span class="tab"></span><span class="tab"></span><span class="tab"></span></div>
      </div>
      <div class="screen">
        <div class="screen-title">Customer Visit</div>
        <div class="line mid"></div>
        <div class="line"></div>
        <div class="line short"></div>
        <div class="tabs"><span class="tab"></span><span class="tab"></span><span class="tab"></span><span class="tab"></span></div>
      </div>
    </div>
  </div>
</body>
</html>
