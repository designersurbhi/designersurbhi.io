<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Customer inquiry portal preview</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 1040px;
      height: 500px;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      color: #17232b;
      background:
        radial-gradient(circle at 88% 8%, rgba(230, 6, 6, .12), transparent 28%),
        linear-gradient(135deg, #fff6f3 0%, #eef5f8 100%);
    }
    body {
      display: grid;
      grid-template-columns: 430px 1fr;
      gap: 42px;
      align-items: center;
      padding: 42px 56px;
    }
    .browser {
      width: 430px;
      height: 330px;
      border-radius: 22px;
      overflow: hidden;
      background: #fff;
      box-shadow: 0 28px 70px rgba(26, 37, 45, .18);
      border: 1px solid #d8e4ea;
    }
    .topbar {
      height: 40px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 16px;
      background: #f6f8fa;
      border-bottom: 1px solid #e2e8ed;
    }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #e60606; }
    .dot:nth-child(2) { background: #d6a744; }
    .dot:nth-child(3) { background: #0b84c6; }
    .app {
      display: grid;
      grid-template-columns: 96px 1fr;
      height: 290px;
    }
    .side {
      padding: 18px 14px;
      background: #fff;
      border-right: 1px solid #e2e8ed;
    }
    .logo {
      height: 28px;
      margin-bottom: 20px;
      border-radius: 7px;
      background: #e60606;
    }
    .nav {
      height: 11px;
      margin: 17px 0;
      border-radius: 999px;
      background: #cfdbe3;
    }
    .nav.active { background: #001146; }
    .main {
      padding: 18px;
      background: #f4f7fa;
    }
    .header {
      height: 34px;
      margin-bottom: 16px;
      border-radius: 9px;
      background: #e60606;
    }
    .panel {
      padding: 16px;
      border-radius: 14px;
      background: #fff;
      border: 1px solid #e2e8ed;
    }
    .title {
      width: 146px;
      height: 15px;
      margin-bottom: 18px;
      border-radius: 999px;
      background: #1f2d35;
    }
    .form-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 11px;
      margin-bottom: 18px;
    }
    .field {
      height: 42px;
      border-radius: 8px;
      background: #f8fafb;
      border: 1px solid #d6e0e7;
    }
    .table {
      display: grid;
      gap: 8px;
    }
    .row {
      height: 20px;
      border-radius: 6px;
      background: #dce4ea;
    }
    .row:nth-child(2) { width: 92%; }
    .row:nth-child(3) { width: 78%; }
    .copy p {
      margin: 0;
    }
    .kicker {
      margin-bottom: 12px;
      color: #e60606;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    h1 {
      max-width: 500px;
      margin: 0 0 20px;
      font-size: 48px;
      line-height: 1.02;
      letter-spacing: -.02em;
    }
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 26px;
    }
    .chip {
      padding: 12px 16px;
      border-radius: 999px;
      background: #fff;
      color: #00426e;
      border: 1px solid #d8e4ea;
      font-size: 18px;
      font-weight: 800;
      box-shadow: 0 12px 28px rgba(26, 37, 45, .08);
    }
  </style>
</head>
<body>
  <div class="browser">
    <div class="topbar"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
    <div class="app">
      <div class="side">
        <div class="logo"></div>
        <div class="nav"></div>
        <div class="nav"></div>
        <div class="nav active"></div>
        <div class="nav"></div>
        <div class="nav"></div>
      </div>
      <div class="main">
        <div class="header"></div>
        <div class="panel">
          <div class="title"></div>
          <div class="form-grid">
            <div class="field"></div><div class="field"></div><div class="field"></div>
            <div class="field"></div><div class="field"></div><div class="field"></div>
          </div>
          <div class="table">
            <div class="row"></div>
            <div class="row"></div>
            <div class="row"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="copy">
    <p class="kicker">Customer inquiry portal</p>
    <h1>Sales operations workflows for inquiry tracking</h1>
    <div class="chips">
      <span class="chip">Customer details</span>
      <span class="chip">Inquiry tables</span>
      <span class="chip">Admin flows</span>
    </div>
  </div>
</body>
</html>
